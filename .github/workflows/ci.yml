# Checks every pull request. See
# external/Kinetra/docs/testing.md#continuous-integration for the shared design.
#
# Same pinned toolchain as Kinetra's CI (dated Arch Linux image plus Arch Linux
# Archive snapshot), so engine warnings (-Werror) and clang-format output cannot
# change without a commit. When the archive does not answer, the run falls back to
# the current Arch packages and says so in a warning (Kinetra's testing.md).
# Bump ARCH_SNAPSHOT and the image tag together, in both repositories. Lab
# warnings are reported but not errors until each module's roadmap phase makes it
# warning-free. The `ci` test preset runs every test, the graphics cases and the smoke
# runs of every executable included, with SDL's offscreen driver and software Mesa: an
# OpenGL context without a GPU or display, the backend of the local `graphics` preset.
# The workflow name "CI" and job id "checks" are required status checks on main.
#
# The "ubuntu" job builds and tests on Ubuntu LTS with its own GCC, glibc and packages, so
# Linux beyond Arch stays supported (README, quick start). It puts /usr/bin first on the
# path, so the runner image's newer CMake in /usr/local/bin does not stand in for Ubuntu's.
# The pinned Arch job stays the reference: formatting and the docs check run only there,
# and warnings are errors only there, the engine's and those of Lab's warning-free modules,
# because another GCC warns about other things; the ubuntu job shows them as annotations.
# Ubuntu's packages follow the runner image.
#
# The "windows" job builds natively with MSYS2's MinGW-w64 GCC, the compiler family
# of the local WSL cross build (docs/windows.md), and runs the non-graphics tests on
# Windows. MSYS2 packages are not pinned like the Arch snapshot; the job follows
# MSYS2's current release.
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH_SNAPSHOT: "2026/11/17"

jobs:
  # Decides whether this pull request only moves the Kinetra pointer, to a commit on Kinetra
  # main, over Kinetra changes in Markdown, docs or skills. Then the build and test jobs
  # below are skipped (a skipped job counts as passed for the required "checks" status) and
  # only the docs check runs here. Any doubt, such as a failed Kinetra fetch, means a full
  # run, and so does a failure of this job: the docs check then fails "checks" as well.
  changes:
    runs-on: ubuntu-latest
    outputs:
      skip_build: ${{ steps.decide.outputs.skip_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether build and tests are needed
        id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          skip=false
          kinetra="$RUNNER_TEMP/kinetra"
          url=$(git config -f .gitmodules submodule.external/Kinetra.url || true)
          git cat-file -e "$HEAD" 2>/dev/null || git fetch -q origin "$HEAD" || true
          # --no-renames: a rename lists both its old and its new path, so a source
          # moved into docs/ or renamed to .md still counts as a source change.
          if mb=$(git merge-base "$BASE" "$HEAD" 2>/dev/null); then
            files=$(git diff --no-renames --name-only "$mb" "$HEAD")
            printf 'Changed in this pull request:\n%s\n' "$files"
            if [ "$files" = "external/Kinetra" ]; then
              old=$(git rev-parse "$mb:external/Kinetra")
              new=$(git rev-parse "$HEAD:external/Kinetra")
              if [ -n "$url" ] && git clone -q --filter=blob:none --no-checkout "$url" "$kinetra" \
                && kfiles=$(git -C "$kinetra" diff --no-renames --name-only "$old" "$new"); then
                printf 'Kinetra %s..%s changed:\n%s\n' "$old" "$new" "${kfiles:-(nothing)}"
                if ! git -C "$kinetra" merge-base --is-ancestor "$new" origin/main; then
                  echo "::error title=Pointer not on Kinetra main::A pointer-only pull request must record a commit on Kinetra main; $new is not. The full CI runs."
                  echo "skip_build=false" >> "$GITHUB_OUTPUT"
                  exit 1
                fi
                if ! printf '%s\n' "$kfiles" | grep -v -E '(\.md$|^docs/|^\.agents/)' | grep -q .; then
                  skip=true
                fi
              else
                echo "::warning title=Pointer range not checked::Could not clone Kinetra from '$url' or diff $old..$new; the full CI runs."
              fi
            fi
          fi
          echo "skip_build=$skip"
          echo "skip_build=$skip" >> "$GITHUB_OUTPUT"

      - name: Documentation links (pointer-only pull request)
        if: steps.decide.outputs.skip_build == 'true'
        run: |
          git submodule update --init --recursive
          python3 external/Kinetra/tools/check_docs.py

  checks:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.skip_build != 'true') }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel-20261108.0.623074
    steps:
      - name: Install pinned toolchain and dependencies
        run: |
          # The pinned snapshot comes from the Arch Linux Archive. When the archive does not
          # answer, the image's own mirrors serve the current packages instead; such a run is
          # not pinned, so it says so in a warning, and the versions below show what it got.
          packages="git python cmake ninja ccache clang sdl2-compat libglvnd mesa nlohmann-json"
          cp /etc/pacman.d/mirrorlist /etc/pacman.d/mirrorlist.image
          echo "Server = https://archive.archlinux.org/repos/${ARCH_SNAPSHOT}/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist
          if ! pacman -Syyuu --noconfirm --needed $packages; then
            echo "::warning title=Toolchain not pinned::The Arch Linux Archive did not answer, so this run uses the current Arch packages instead of snapshot ${ARCH_SNAPSHOT}."
            cp /etc/pacman.d/mirrorlist.image /etc/pacman.d/mirrorlist
            pacman -Syyuu --noconfirm --needed $packages
          fi
          gcc --version | head -1; clang-format --version; cmake --version | head -1

      - uses: actions/checkout@v7

      - name: Trust the workspace and fetch the Kinetra submodule
        run: |
          git config --global --add safe.directory '*'
          git submodule update --init --recursive
          git submodule status

      - name: Format check (clang-format)
        run: git ls-files -- '*.h' '*.cpp' | xargs clang-format --dry-run --Werror

      - name: Documentation links
        run: python3 external/Kinetra/tools/check_docs.py

      - name: Headless build and test (application logic without SDL2/OpenGL)
        run: cmake --workflow --preset headless

      - name: Full build and test (applications, engine warnings as errors, graphics tests and smoke runs with software OpenGL)
        run: cmake --workflow --preset ci

  ubuntu:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.skip_build != 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          # The Debian and Ubuntu package set of the README's quick start.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build ccache \
            libsdl2-dev libgl-dev libegl-dev libgl1-mesa-dri libegl-mesa0 nlohmann-json3-dev
          # Ubuntu's own tools, not the runner image's newer ones in /usr/local/bin.
          echo /usr/bin >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          command -v gcc cmake ctest ninja
          gcc --version | head -1; cmake --version | head -1; ninja --version; ldd --version | head -1

      - uses: actions/checkout@v7

      - name: Fetch the Kinetra submodule
        run: |
          git submodule update --init --recursive
          git submodule status

      - name: Headless build and test (application logic without SDL2/OpenGL)
        run: cmake --workflow --preset headless

      - name: Full build and test (applications, warnings as annotations, graphics tests and smoke runs with software OpenGL)
        run: |
          set -o pipefail
          cmake --preset ci -DKINETRA_WARNINGS_AS_ERRORS=OFF -DKINETRA_LAB_WARNING_FREE_AS_ERRORS=OFF
          cmake --build --preset ci 2>&1 | tee build-ci.log
          grep -E 'warning: ' build-ci.log | sort -u | sed 's/^/::warning title=Compiler warning on Ubuntu::/' || true
          ctest --preset ci

  windows:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.skip_build != 'true') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Keep line endings as committed
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-nlohmann-json

      - name: Fetch the Kinetra submodule
        run: |
          git config --global --add safe.directory '*'
          git submodule update --init --recursive
          gcc --version | head -1; cmake --version | head -1

      - name: Build and test on Windows (MinGW-w64, graphics tests compiled, engine warnings as errors)
        run: cmake --workflow --preset windows-native
