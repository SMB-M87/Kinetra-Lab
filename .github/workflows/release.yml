# Publishes a ready-to-run Windows zip (launcher, applications, SDL2.dll,
# i4sim blueprints, licenses) as a GitHub Release asset, so trying Kinetra-Lab
# needs no compiler. See tools/release/README.md.
#
# - A push to main refreshes the pre-release "main-build"; its zip has a fixed
#   download URL that the README links to. The "changes" job skips the build when
#   nothing that goes into the zip changed since the commit main-build was built
#   from: tools/release/needs_build.sh, the decision CI uses too (only Markdown,
#   docs/ or .agents/ in Lab, apart from README.md, docs/media/ and the blueprints,
#   and in a moved Kinetra range also .claude/, .codex/config.toml, .github/ or tools/,
#   apart from its README.md and docs/media/). main-build then stays on that commit.
# - A tag v* publishes a release of its own with the same zip, always built.
# - workflow_dispatch always builds; on main it also refreshes main-build.
#
# Ubuntu 24.04 cross-builds the zip with MinGW-w64 (the "windows" preset). The build links
# the GCC runtime statically and checks that the executables need only SDL2.dll and
# Windows system DLLs. The pull request's CI tests the applications, including on Windows.
#
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE: Kinetra-Lab-windows-x64

jobs:
  # Only for a push to main: compares HEAD with the commit of the main-build tag. Any doubt
  # (no tag, a failed decision) builds, because package runs unless this job succeeded and
  # said "false".
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The decision needs commits and trees, not the old tour videos' contents.
          fetch-depth: 0
          filter: blob:none

      - name: Decide whether the zip can have changed since main-build
        id: decide
        run: |
          if base=$(git rev-parse -q --verify 'refs/tags/main-build^{commit}'); then
            build=$(tools/release/needs_build.sh "$base" "$GITHUB_SHA")
          else
            echo "No main-build tag; the zip is built."
            build=true
          fi
          if [ "$build" = false ]; then
            echo "::notice title=Release not rebuilt::Nothing that goes into the zip changed since ${base::7} (tools/release/needs_build.sh); main-build keeps the zip built from that commit."
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  package:
    needs: changes
    # changes is skipped for a tag or workflow_dispatch; that, or a failed decision, builds.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.build != 'false') }}
    runs-on: ubuntu-24.04
    # A run takes about two minutes; the limit leaves room for an install step that runs
    # out its 15 minutes and for a slow runner.
    timeout-minutes: 30
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Ubuntu's MinGW-w64 cross toolchain
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          packages="git ca-certificates cmake ninja-build ccache g++-mingw-w64-x86-64-posix"
          # Use the same Azure mirror and fallback as the pull request build.
          sources=/etc/apt/sources.list.d/ubuntu.sources
          cp "$sources" /etc/apt/ubuntu.sources.image
          sed -i -E 's#^URIs: http://(archive|security)\.ubuntu\.com/ubuntu/?$#URIs: http://azure.archive.ubuntu.com/ubuntu/#' "$sources"
          grep '^URIs:' "$sources"
          if grep -q -v -x 'URIs: http://azure\.archive\.ubuntu\.com/ubuntu/' <<< "$(grep '^URIs:' "$sources")"; then
            echo "::warning title=Ubuntu mirror not used::A URI of the image's ubuntu.sources does not match this step's pattern, so this run installs from that source instead of the Azure mirror."
          fi
          apt_install() { apt-get install -y --no-install-recommends $packages; }
          # Bound only the index update and the downloads, so the fallback has time to run and
          # dpkg can finish.
          export packages
          if ! { timeout -k 10 90 bash -c 'apt-get update -o APT::Update::Error-Mode=any && apt-get install -y --no-install-recommends --download-only $packages' && apt_install; }; then
            echo "::warning title=Ubuntu mirror not used::The Azure mirror of the Ubuntu archive failed or did not deliver the indexes and packages within 90 seconds, so this run installs from the image's own sources."
            cp /etc/apt/ubuntu.sources.image "$sources"
            apt-get update
            apt_install
          fi

      - name: Tool versions
        run: |
          command -v x86_64-w64-mingw32-g++ x86_64-w64-mingw32-objdump cmake ninja
          x86_64-w64-mingw32-g++ --version | sed -n 1p
          cmake --version | sed -n 1p
          ninja --version

      - uses: actions/checkout@v7

      - name: Trust the workspace and fetch the Kinetra submodule
        run: |
          git config --global --add safe.directory '*'
          git submodule update --init --recursive
          git submodule status

      - name: Cross-build the launcher and the applications for Windows
        run: |
          cmake --preset windows
          cmake --build --preset windows --target kinetra kinetra_demo kinetra_dotio kinetra_i4sim

      - name: Check that the executables import only Windows libraries and SDL2.dll
        run: |
          for exe in build-windows/kinetra*.exe; do
            case "$exe" in *_tests.exe) continue ;; esac
            imports="$(x86_64-w64-mingw32-objdump -p "$exe" | sed -n 's/^\s*DLL Name: //p' | tr 'A-Z' 'a-z' | sort -u)"
            echo "$exe: $(echo $imports)"
            unexpected="$(echo "$imports" | grep -Ev '^(sdl2\.dll|kernel32\.dll|user32\.dll|gdi32\.dll|shell32\.dll|advapi32\.dll|ole32\.dll|opengl32\.dll|msvcrt\.dll|api-ms-win-.*\.dll)$' || true)"
            if [ -n "$unexpected" ]; then echo "unexpected DLL imports in $exe: $unexpected"; exit 1; fi
          done

      - name: Package the zip
        run: tools/release/package_windows.sh build-windows "dist/${PACKAGE}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: dist/${{ env.PACKAGE }}.zip
          if-no-files-found: error

  publish:
    needs: package
    # Explicit: the default success() also looks at changes, which is skipped for a tag.
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE }}

      - name: Publish a tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${PACKAGE}.zip" --clobber
          else
            gh release create "$tag" "${PACKAGE}.zip" --title "Kinetra-Lab $tag" --generate-notes
          fi

      - name: Refresh the main-build pre-release
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete main-build --cleanup-tag --yes || true
          gh release create main-build "${PACKAGE}.zip" \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "Kinetra-Lab main build" \
            --notes "Windows build of main at ${GITHUB_SHA::7}, refreshed on every merge that can change the zip. Unzip and start kinetra.exe; see README.txt in the zip. For a fixed version, use a release tagged v*."
